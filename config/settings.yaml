# ══════════════════════════════════════════════════════════════
# 通用任务处理器全局配置。代码中不应再有硬编码参数。
# ${VAR} 语法：加载时展开为环境变量（可在项目根 .env 中定义）。
# 任务类型、可接收文件、提示词、输出形态见 config/tasks.yaml。
# ══════════════════════════════════════════════════════════════

# ── dsh SDK / 网关 ─────────────────────────────────────────────
base_url: "${GATEWAY_BASE_URL}"       # OpenAI 兼容网关 chat/completions 端点
api_key_env: GATEWAY_API_KEY          # 密钥所在环境变量名（密钥不落本文件）
api_key: "${GATEWAY_API_KEY}"
model: "Qwen3.8-Flash-Next"           # 内部默认模型（无需单独测速）
provider: qwen-gateway                # llm-pi-ai 自定义路由 id
api_style: openai-completions         # 协议：openai-completions | anthropic-messages
profile: sdk                          # dsh cordis profile
reasoning_effort: medium              # off | low | medium | high | max（默认 medium）
max_tokens: 49152
context_window: 262144
supports_developer_role: false        # 网关拒绝 developer 角色时必须 false
initialize_timeout_seconds: 120
request_timeout_seconds: 120          # SDK RPC 请求超时（不含 Agent 运行时长）

# ── 服务 ───────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 11443
  sync_max_waiters: 8                 # 同时阻塞等待结果的 sync 请求上限，超出直接 202

# ── Agent 执行 ─────────────────────────────────────────────────
agent:
  timeout_seconds: 900                # 单任务硬超时（任务级可覆盖），超时强杀 harness
  # DSH 权限预设：read-only | workspace-write | danger-full-access
  # 打包 exe 内沙箱执行器无法启动，默认用 danger-full-access 保证可运行；
  # 源码/受控环境想收紧时，设环境变量 DSH_PERMISSION_MODE=workspace-write 覆盖。
  # 注意：danger-full-access 关闭文件作用域限制与审批，Agent 可读取项目内 .env。
  permission_mode: "${DSH_PERMISSION_MODE:danger-full-access}"

# ── 上传与结果约束 ─────────────────────────────────────────────
limits:
  max_file_bytes: 52428800            # 单个上传文件 50MB
  result_max_bytes: 20971520          # result.json 最大 20MB

# ── 路径（相对项目根，自动解析为绝对路径）─────────────────────
paths:
  gateway_patch_template: config/gateway.patch.yml
  gateway_patch_rendered: config/_generated/gateway.patch.yml
  tasks_file: config/tasks.yaml
  prompt_dir: config/prompts
  workspace_root: data/workspaces
  dsh_home: data/dsh-home
  db_file: data/tasks.db
  tmp_dir: data/tmp

# ── Prompt 全局片段 ────────────────────────────────────────────
prompt_vars:
  final_output_constraint: "最终回复必须且只能是一个合法 JSON 对象：不要 Markdown 代码块、不要任何前后说明文字。"
